<div class="app-shell auth-shell">
  <div class="auth-layout">
    <div class="auth-aside" aria-hidden="true">
      <span class="section-label">Sécurité</span>
      <h2 class="h2">Connexion claire,<br />accès immédiat</h2>
      <p class="text-secondary">Un formulaire focalisé — une action principale par écran.</p>
    </div>

    <div class="auth-panel app-card">
      <header class="auth-panel__head">
        <h1 class="auth-title display-sm">Bon retour</h1>
        <p class="auth-subtitle text-secondary">Connectez-vous pour gérer vos sessions et analytics.</p>
      </header>

      @if (error) {
        <div class="alert alert-danger" role="alert">{{ error }}</div>
      }

      <form class="form-shell" [formGroup]="form" (ngSubmit)="submit()">
        <div class="form-field">
          <label for="username">Nom d'utilisateur</label>
          <input id="username" class="form-control" formControlName="username" autocomplete="username" />
        </div>
        <div class="form-field">
          <label for="password">Mot de passe</label>
          <div class="password-input-wrapper">
            <input id="password" class="form-control" [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1" [attr.aria-label]="showPassword ? 'Masquer' : 'Afficher'">
              <span *ngIf="!showPassword" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              </span>
              <span *ngIf="showPassword" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3l18 18"/><path d="M10.58 10.58A3 3 0 0 0 12 15a3 3 0 0 0 1.42-.35"/></svg>
              </span>
            </button>
          </div>
        </div>
        <button class="btn-primary btn-lg btn-block" type="submit" [disabled]="loading">
          {{ loading ? 'Connexion…' : 'Se connecter' }}
        </button>
      </form>

      <p class="auth-footer text-secondary">
        Pas encore de compte ?
        <a class="link-arrow" routerLink="/register">Créer un compte</a>
      </p>
    </div>
  </div>
</div>

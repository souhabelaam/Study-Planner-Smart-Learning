<div class="app-shell auth-shell">
  <div class="auth-hero">
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-subtitle">Start planning your sessions and get AI-powered insights.</p>
  </div>
  <div class="app-card auth-card">
    <h2 class="mb-0">Register</h2>
    @if (error) {
    <div class="alert alert-danger">{{ error }}</div>
    }
    <form class="form-shell" [formGroup]="form" (ngSubmit)="submit()">
      <div>
        <label>Username</label>
        <input class="form-control" formControlName="username" />
      </div>
      <div>
        <label>Email</label>
        <input class="form-control" type="email" formControlName="email" />
      </div>
      <div>
        <label>Password</label>
        <input class="form-control" type="password" formControlName="password" />
      </div>
      <button class="btn-primary" type="submit" [disabled]="loading">Create account</button>
    </form>
    <p class="mt-3">
      Already registered?
      <a class="cta-link" routerLink="/login">Back to login</a>
    </p>
  </div>
</div>

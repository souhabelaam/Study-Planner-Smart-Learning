# Test Configuration with MySQL Database
spring.datasource.url=jdbc:mysql://${MYSQL_TEST_HOST:localhost}:${MYSQL_TEST_PORT:3306}/${MYSQL_TEST_DATABASE:studyplanner_test}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_TEST_USER:${MYSQL_USER:root}}
spring.datasource.password=${MYSQL_TEST_PASSWORD:${MYSQL_PASSWORD:root}}

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Disable security for tests
spring.security.user.name=test
spring.security.user.password=test

# Logging
logging.level.org.springframework.data.jpa=WARN
logging.level.org.hibernate.SQL=WARN

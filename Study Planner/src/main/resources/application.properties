spring.application.name=Study Planner

# Server port
server.port=${SERVER_PORT:8080}

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/studyplanner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true



# Logging
logging.level.org.springframework.data.jpa=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.root=INFO

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:MY_SECRET_KEY_2025}
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# Gemini Chat (set GEMINI_API_KEY in your environment)
app.gemini.apiKey=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}
